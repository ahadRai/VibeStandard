- id: h2-database
  name: H2 in-memory database detected
  severity: critical
  analyzer: dependency
  ecosystem: java
  message: >
    H2 is a test and development database only. It stores data in memory
    and is wiped on every restart. It is not suitable for production.
    This is one of the most common mistakes in vibe-coded Spring Boot apps.
  fix: >
    Replace your H2 dependency with PostgreSQL. In pom.xml, swap
    com.h2database for org.postgresql:postgresql. Update your
    spring.datasource.url to a PostgreSQL connection string and
    store credentials in environment variables.
  match:
    files: ["pom.xml", "build.gradle", "build.gradle.kts"]
    pattern: "com\\.h2database|h2:mem|jdbc:h2|H2ConsoleAutoConfiguration"

- id: hsqldb-database
  name: HSQLDB in-memory database detected
  severity: critical
  analyzer: dependency
  ecosystem: java
  message: >
    HSQLDB (HyperSQL) is a lightweight, in-memory database intended for
    development and testing. Data is lost on restart. Not production-grade.
  fix: >
    Replace HSQLDB with a production database such as PostgreSQL or MySQL.
    Update your datasource URL and store credentials in environment variables.
  match:
    files: ["pom.xml", "build.gradle", "build.gradle.kts"]
    pattern: "org\\.hsqldb|hsqldb|jdbc:hsql"

- id: derby-database
  name: Apache Derby embedded database detected
  severity: critical
  analyzer: dependency
  ecosystem: java
  message: >
    Apache Derby (embedded mode) is a development database. It is not
    designed for production workloads or concurrent access at scale.
  fix: >
    Replace Derby with PostgreSQL or another production-grade RDBMS.
    Update your datasource URL and store credentials in environment variables.
  match:
    files: ["pom.xml", "build.gradle", "build.gradle.kts"]
    pattern: "org\\.apache\\.derby|jdbc:derby"

- id: ddl-create-drop
  name: JPA DDL auto set to create-drop
  severity: critical
  analyzer: dependency
  ecosystem: java
  message: >
    spring.jpa.hibernate.ddl-auto=create-drop will DROP and recreate all
    tables on every application restart. This will destroy your production data.
  fix: >
    Set ddl-auto to 'validate' or 'none' in production. Use a migration tool
    such as Flyway or Liquibase to manage schema changes safely.
  match:
    files: ["*.properties", "*.yml", "*.yaml"]
    pattern: "ddl-auto\\s*[=:]\\s*create-drop"
