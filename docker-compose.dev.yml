version: "3.9"

services:

  api:
    build:
      context: .
      dockerfile: vibestandard-api/Dockerfile
    volumes:
      # Mount source for hot reload
      - ./vibestandard-api:/app
      - ./vibestandard-analyzers:/vibestandard-analyzers
      - clone-storage:/tmp/vibestandard-clones
    environment:
      - DEBUG=true
      - CORS_ORIGINS=http://localhost:3000,http://localhost:5173
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  web:
    # In dev, run Vite dev server instead of nginx
    build:
      context: vibestandard-frontend/vibestandard-web
      dockerfile: Dockerfile.dev
    volumes:
      - ./vibestandard-frontend/vibestandard-web:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    command: npm run dev -- --host 0.0.0.0
