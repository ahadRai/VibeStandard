version: "3.9"

services:

  api:
    build:
      context: .
      dockerfile: vibestandard-api/Dockerfile
    container_name: vibestandard-api
    expose:
      - "8000"
    environment:
      - DEBUG=${DEBUG:-false}
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
      - MAX_CONCURRENT_SCANS=5
      - CLONE_DIR=/tmp/vibestandard-clones
    volumes:
      - clone-storage:/tmp/vibestandard-clones
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  web:
    build:
      context: vibestandard-frontend/vibestandard-web
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL:-http://localhost:8000}
    container_name: vibestandard-web
    expose:
      - "3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000"]
      interval: 30s
      timeout: 5s
      retries: 3

  proxy:
    image: nginx:alpine
    container_name: vibestandard-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx-proxy.conf:/etc/nginx/conf.d/proxy.conf.template:ro
      - ./nginx-entrypoint.sh:/docker-entrypoint-custom.sh:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    environment:
      - DOMAIN=${DOMAIN:-localhost}
    entrypoint: ["/bin/sh", "/docker-entrypoint-custom.sh"]
    depends_on:
      - api
      - web
    restart: unless-stopped

  certbot:
    image: certbot/certbot
    container_name: vibestandard-certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

volumes:
  clone-storage:
    driver: local

networks:
  default:
    name: vibestandard-network
