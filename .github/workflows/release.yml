name: Build and Release Binaries

on:
  push:
    tags:
      - 'v*'  # Triggers on tags like v0.1.0, v1.0.0, etc.

permissions:
  contents: write  # Required to create releases and upload assets

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            binary_name: vibestandard
            artifact_name: vibestandard-linux
          - os: windows-latest
            platform: windows
            binary_name: vibestandard.exe
            artifact_name: vibestandard-windows.exe
          - os: macos-latest
            platform: macos
            binary_name: vibestandard
            artifact_name: vibestandard-macos

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -e .

      - name: Build binary with PyInstaller
        run: |
          pyinstaller --name vibestandard-${{ matrix.platform }} --onefile --console --add-data "rules:rules" --add-data "vibestandard/reporters/templates:vibestandard/reporters/templates" main.py

      - name: Verify binary exists
        run: |
          ls -la dist/
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            test -f dist/vibestandard-${{ matrix.platform }}.exe
          else
            test -f dist/vibestandard-${{ matrix.platform }}
          fi

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: vibestandard-${{ matrix.platform }}
          path: dist/vibestandard-${{ matrix.platform }}${{ matrix.os == 'windows-latest' && '.exe' || '' }}
          retention-days: 5

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: |
          ls -la artifacts/
          find artifacts/ -type f

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/vibestandard-linux/vibestandard-linux
            artifacts/vibestandard-windows/vibestandard-windows.exe
            artifacts/vibestandard-macos/vibestandard-macos
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
