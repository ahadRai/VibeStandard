name: Build and Release Binaries

on:
  push:
    tags:
      - 'v*'  # Triggers on tags like v0.1.0, v1.0.0, etc.

permissions:
  contents: write  # Required to create releases and upload assets

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            binary_name: vibestandard
            artifact_name: vibestandard-linux
          - os: windows-latest
            platform: windows
            binary_name: vibestandard.exe
            artifact_name: vibestandard-windows.exe
          - os: macos-latest
            platform: macos
            binary_name: vibestandard
            artifact_name: vibestandard-macos

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          if [ -f pyproject.toml ]; then
            pip install .
          fi
        shell: bash

      - name: Build binary with PyInstaller
        run: |
          pyinstaller \
            --name vibestandard-${{ matrix.platform }} \
            --onefile \
            --console \
            --add-data "rules${{ matrix.platform == 'windows' && ';' || ':' }}rules" \
            --add-data "vibestandard/reporters/templates${{ matrix.platform == 'windows' && ';' || ':' }}vibestandard/reporters/templates" \
            main.py
        shell: bash

      - name: Verify binary
        run: |
          if [ "${{ matrix.platform }}" = "windows" ]; then
            dist/vibestandard-${{ matrix.platform }}.exe --version
          else
            dist/vibestandard-${{ matrix.platform }} --version
          fi
        shell: bash

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/vibestandard-${{ matrix.platform }}${{ matrix.platform == 'windows' && '.exe' || '' }}
          retention-days: 5

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: |
          ls -la artifacts/
          find artifacts/ -type f

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/vibestandard-linux/vibestandard-linux
            artifacts/vibestandard-windows.exe/vibestandard-windows.exe
            artifacts/vibestandard-macos/vibestandard-macos
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
